name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Generate launcher icons
        run: |
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          cp public/app-icon.png resources/icon-only.png
          cp public/app-icon.png resources/icon-background.png
          bunx @capacitor/assets generate --android || true

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/heart-alarm.keystore
          cat > android/keystore.properties <<EOF
          storeFile=heart-alarm.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK + AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: heart-alarm-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
