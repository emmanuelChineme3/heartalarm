name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install web deps
        run: bun install

      - name: Build web
        run: bun run build

      - name: Sync web assets into committed Android project
        run: |
          echo "Current directory:"
          pwd

          echo "Capacitor version:"
          bunx cap --version

          echo "Repository contents:"
          ls -la

          mkdir -p android/app/src/main/assets

          echo "Android folder:"
          ls -la android

          echo "Main folder:"
          ls -la android/app/src/main

          echo "Assets before sync:"
          ls -la android/app/src/main/assets

          bunx cap sync android

          echo "Assets after sync:"
          ls -la android/app/src/main/assets

      - name: Generate launcher icons
        run: |
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          cp public/app-icon.png resources/icon-only.png
          cp public/app-icon.png resources/icon-background.png
          bunx @capacitor/assets generate --android || true

      - name: Write signing config from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/heart-alarm.keystore

          echo "===== KEYSTORE DEBUG ====="
          ls -lh android/app/heart-alarm.keystore
          file android/app/heart-alarm.keystore
          sha256sum android/app/heart-alarm.keystore

          echo "===== KEYSTORE CONTENTS ====="
          keytool -list \
            -keystore android/app/heart-alarm.keystore \
            -storepass "$KEYSTORE_PASSWORD" || true

          cat > android/keystore.properties <<EOF
          storeFile=heart-alarm.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK + AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signatures
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

          JARSIGNER=$(which jarsigner)

          for aab in android/app/build/outputs/bundle/release/*.aab; do
            echo "Verifying $aab"
            "$JARSIGNER" -verify -verbose "$aab" | tail -n 5
          done

      - name: Upload signed APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: heart-alarm-android-signed
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
