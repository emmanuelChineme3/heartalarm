name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web deps
        run: bun install

      - name: Build web
        run: bun run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

          bunx cap sync android

      - name: Generate launcher icons
        run: |
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          cp public/app-icon.png resources/icon-only.png
          cp public/app-icon.png resources/icon-background.png
          bunx @capacitor/assets generate --android || true

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/heart-alarm.keystore

          cat > android/keystore.properties <<EOF
          storeFile=heart-alarm.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK + AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: heart-alarm-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
