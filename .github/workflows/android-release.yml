name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
  with:
    distribution: "temurin"
    java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web deps
        run: bun install

      - name: Build web
        run: bun run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

          mkdir -p android/app/src/main/assets

          bunx cap sync android

      - name: Generate launcher icons
        run: |
          mkdir -p resources
          cp public/app-icon.png resources/icon.png
          cp public/app-icon.png resources/icon-only.png
          cp public/app-icon.png resources/icon-background.png
          bunx @capacitor/assets generate --android || true

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

          # Write keystore into app module directory so relative path resolves
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/heart-alarm.keystore

          # keystore.properties lives at the root of the android project
          cat > android/keystore.properties <<EOF
          storeFile=heart-alarm.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          # Inject signingConfigs + wire release build to use it.
          # cap-generated app/build.gradle does not include signing, so we patch it.
          BUILD_GRADLE=android/app/build.gradle

          # Prepend keystore loader at top of file
          cat > /tmp/signing-prepend.gradle <<'EOF'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          EOF
          cat /tmp/signing-prepend.gradle "$BUILD_GRADLE" > "$BUILD_GRADLE.tmp"
          mv "$BUILD_GRADLE.tmp" "$BUILD_GRADLE"

          # Inject signingConfigs { release {...} } and attach it to release buildType.
          # Insert right after the opening `android {` line.
          python3 <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          src = p.read_text()

          signing_block = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file("heart-alarm.keystore")
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''

          # Insert signingConfigs after `android {`
          src = re.sub(r'(android\s*\{\s*\n)', r'\1' + signing_block, src, count=1)

          # Attach signingConfig to release buildType. Handle both existing
          # `release {` block and a bare `buildTypes { }` (add release block).
          if re.search(r'buildTypes\s*\{[^}]*release\s*\{', src, re.DOTALL):
              src = re.sub(
                  r'(buildTypes\s*\{[^}]*release\s*\{\s*\n)',
                  r'\1            signingConfig signingConfigs.release\n',
                  src, count=1, flags=re.DOTALL,
              )
          else:
              src = re.sub(
                  r'(buildTypes\s*\{\s*\n)',
                  r'\1        release {\n            signingConfig signingConfigs.release\n        }\n',
                  src, count=1,
              )

          p.write_text(src)
          print(src)
          PY

      - name: Build APK + AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: heart-alarm-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
