<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ANDROID TEST</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #1a0610; color: #fff5f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { width: 100%; max-width: 400px; text-align: center; }
      .heart {
        font-size: 64px; line-height: 1; margin-bottom: 20px;
        filter: drop-shadow(0 6px 24px rgba(233, 30, 99, 0.55));
        animation: beat 1.6s ease-in-out infinite;
      }
      @keyframes beat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.12); }
        40% { transform: scale(0.98); }
        60% { transform: scale(1.06); }
      }
      .brand {
        margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: 0.3px;
        background: linear-gradient(135deg, #ff6b9d 0%, #e91e63 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      h1 { margin: 12px 0 16px; font-size: 26px; font-weight: 700; color: #fff; }
      p { margin: 0 0 12px; font-size: 16px; line-height: 1.55; color: #f5d7e2; }
      .footer { margin-top: 28px; font-size: 14px; color: #d8b8c4; opacity: 0.85; }
      button {
        appearance: none; -webkit-appearance: none; border: 0; cursor: pointer;
        width: 100%; margin-top: 24px; padding: 14px 24px;
        border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #ff6b9d 0%, #e91e63 100%);
        box-shadow: 0 10px 30px rgba(233, 30, 99, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:active { transform: translateY(1px) scale(0.99); box-shadow: 0 6px 18px rgba(233, 30, 99, 0.3); }
      button[disabled] { opacity: 0.7; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="heart" aria-hidden="true">❤️</div>
      <div class="brand">Heart Alarm</div>
      <h1>You're offline</h1>
      <p>We can't connect to Heart Alarm right now.</p>
      <p>Please check your internet connection and try again.</p>
      <button type="button" id="retry">Retry</button>
      <p class="footer">Your messages, posts, and notifications will be available once you're back online.</p>
    </main>
    <script>
      (function () {
        var APP_URL = "https://heartalarm.lovable.app";
        var btn = document.getElementById("retry");
        function retry() {
          // If still offline, don't navigate — the WebView would show the system error briefly.
          if (navigator.onLine === false) {
            btn.disabled = true;
            var original = btn.textContent;
            btn.textContent = "Still offline…";
            setTimeout(function () { btn.disabled = false; btn.textContent = original; }, 1200);
            return;
          }
          window.location.href = APP_URL;
        }
        btn.addEventListener("click", retry);
        window.addEventListener("online", function () { window.location.href = APP_URL; });
      })();
    </script>
  </body>
</html>
